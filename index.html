        if (currentFamily === "dominant") score += nextFamily === "tonic" ? 10 : 2;
        if (currentFamily) reasons.push(`${currentFamily}-to-${nextFamily}`);
        if (movement === 5) { score += 6; reasons.push("ascending-fourth"); }
        else if (movement === 7) { score += 4; reasons.push("ascending-fifth"); }
        else if ([8,9].includes(movement)) { score += 3; reasons.push("descending-third"); }
        else if ([3,4].includes(movement)) { score += 2; reasons.push("ascending-third"); }
        else if ([1,2,10,11].includes(movement)) { score += 1; reasons.push("stepwise-root"); }
        if (currentFamily === "dominant" && nextFamily === "tonic" && movement === 2) {
            score += 2; reasons.push("stepwise-tonic-alternative");
        }
        // Initial simplicity tuning; these chords remain playable and can still rank.
        if (natural.quality === "dim" || natural.quality === "aug" || degree === 2) {
            score -= 2; reasons.push("initial-simplicity-weight");
        }
        return { root, quality: natural.quality, score, reason: reasons.join("; "),
            commonToneCount: common, degree: degree + 1 };
    }).filter(Boolean);
    candidates.sort((a,b)=>b.score-a.score || b.commonToneCount-a.commonToneCount || a.degree-b.degree);
    return freezeResolvedHarmonyData({ status: "resolved", reason: "initial-diatonic-ranking",
        candidates: candidates.slice(0,3) });
}

function getFreeChordGuidance() {
    const scale = state.contexts.FREE.scale;
    return deriveFreeChordGuidance({ currentHarmony: { root: state.currentRoot, quality: state.currentQuality },
        globalScale: { key: scale.globalKey, scale: scale.globalScale } });
}

function getFreeManualInputQuality(root) {
    if (noteIndex(root) === noteIndex(state.currentRoot)) return state.currentQuality;
    const scale = state.contexts.FREE.scale;
    const natural = deriveNaturalChordQuality(root,{ key: scale.globalKey, scale: scale.globalScale });
    if (natural.resolved) return natural.quality;
    if (natural.reason === "out-of-scale-root") return "Maj";
    // No invented Pentatonic parent: retain the existing quality when unresolved.
    return state.currentQuality;
}
// FREE CHORD GUIDANCE END.

// IPAD NEXT BEGIN: displayed NEXT selection is an explicit Timeline command.
function seekPresetHarmonyOccurrence(occurrence, timestamp = performance.now()) {
    // Use the occurrence's absolute beat, including last -> first in the next cycle.
    setPresetPlaybackPosition(occurrence.absoluteStartBeat, timestamp);
    state.presetPlayback.tickPending = true;
    restartAccompanimentScheduling(true);
    updateUI();
}

function getLeftNextSelection(key) {
    if (state.mode === "FREE" || !key.classList.contains("lh-next")) return null;
    const next = getPresetHarmonyPlayback().nextOccurrence;
    // A stale painted NEXT is never reinterpreted as a different occurrence.
    if (!next || key.dataset.nextOccurrenceId !== next.occurrenceId ||
        noteIndex(key.dataset.note) !== noteIndex(getHarmonyFromOccurrence(next).root)) return null;
    return next;
}
// IPAD NEXT END.

function handleLeftKey(note, timestamp = performance.now(), held = false, nextOccurrence = null) {
    const harmony = getLeftInputHarmony(note, nextOccurrence);
    if (noteIndex(note) !== noteIndex(state.currentRoot)) clearManualBassChoice();
    if (state.mode === "FREE") {
        state.currentRoot = harmony.root;
        state.currentQuality = harmony.quality;
    } else if (nextOccurrence !== null) {
        seekPresetHarmonyOccurrence(nextOccurrence);
        clearManualHarmony("PRESET");
        state.currentRoot = harmony.root;
        state.currentQuality = harmony.quality;
        setManualBassChoice(harmony.root, harmony.bass);
    } else {
        activateManualHarmony(harmony.root, harmony.quality, "PRESET", timestamp, harmony.bass);
        state.currentRoot = harmony.root;
        setManualBassChoice(harmony.root, harmony.bass);
    }
    const groupId = playManualHarmony(harmony, { held, timestamp });
    latestManualLeftGroupId = groupId;
    updateUI();
    return groupId;
}

function advanceChord() {
    const progression = getProgression();
    if (state.mode === "FREE") {
        state.freePlayback.chordIndex = (state.freePlayback.chordIndex + 1) % progression.length;
    } else {
        const next = getPresetHarmonyPlayback().nextOccurrence;
        if (next === null) return;
        seekPresetHarmonyOccurrence(next);
        clearManualHarmony("PRESET"); // Explicit NEXT also wins when input timestamps are equal.
    }
    const current = getAccompanimentHarmony();

    state.currentRoot = current.root;
    state.currentQuality = current.quality;

    setManualBassChoice(current.root, current.bass);
    playManualHarmony(current);
    updateUI();
}

// R7-1 BEGIN: DOM-free visual projection. Music decisions belong to R4/R5.
function deriveRightKeyVisualState(pitchClass, context, pressed = false) {
    const chordTones = context.chordMetadata.tones.filter(t => t.pitchClass === pitchClass);
    const inEffectiveScale = context.effectiveScale.pitchClasses.includes(pitchClass);
    const targets = context.guidance.targets.filter(c => c.pitchClass === pitchClass);
    const connectors = context.guidance.connectors.filter(c => c.pitchClass === pitchClass);
    const targetVisible = targets.some(c => context.guidance.display.targets.includes(c.id));
    const connectorVisible = connectors.some(c => context.guidance.display.connectors.includes(c.id));
    return {
        pitchClass,
        semanticRole: chordTones.length ? "chord" : inEffectiveScale ? "scale" : "neutral",
        chordRole: chordTones.map(t => t.role).join(" / ") || null,
        inEffectiveScale,
        // Retain whole R5 candidates, including scores, reasons and all routes.
        futureRoles: { targets, connectors },
        futureDisplayRole: targetVisible ? "target" : connectorVisible ? "connector" : null,
        pressed
    };
}

function deriveLeftKeyVisualState(pitchClass, context, pressed = false) {
    const current = pitchClass === context.currentPitchClass;
    const next = pitchClass === context.nextPitchClass;
    const connector = context.connectorPitchClasses.includes(pitchClass);
    return { pitchClass, current, next, connector,
        semanticRole: current ? "current" : next ? "next" : connector ? "connector" : "neutral",
        pressed };
}

function renderKeyTheoryLabel(label, chordRole) {
    // Presentation spelling only; never infer a role from semitone distance.
    label.textContent = chordRole ? chordRole.replace(/b/g, "♭").replace(/#/g, "♯") : "";
}
// R7-1 END.

// R7-2.1 BEGIN: only presentation is deferred; audio/input ownership stays synchronous.
let rightVisualRefreshPending = false;
function scheduleRightVisualRefresh() {
    if (rightVisualRefreshPending) return;
    rightVisualRefreshPending = true;
    window.requestAnimationFrame(() => {
        rightVisualRefreshPending = false;
        withPresetClockSnapshot(() => updateRightKeyHighlights());
    });
}
// R7-2.1 END.

// R7-2 BEGIN: presentation only; no candidate, score or route decisions.
function deriveMarkerTemporalOpacity(playback, position, playing) {
    if (!playing) return 0.70;
    const occurrence = playback.currentOccurrence;
    const progress = Math.max(0, Math.min(1,
        (position - occurrence.absoluteStartBeat) /
        (occurrence.absoluteEndBeat - occurrence.absoluteStartBeat)));
    return 0.10 + 0.90 * Math.pow(progress, 1.3);
}

// Only the outer halo changes with time; the opaque role/score core stays fixed.
function applyFutureMarkerHalo(halo, opacity) {
    const convergence = Math.max(0, Math.min(1, (opacity - 0.10) / 0.90));
    halo.style.opacity = String(opacity);
    halo.style.setProperty("--halo-scale", String(1.8 - 0.78 * convergence));
    halo.style.setProperty("--halo-border-width", `${2 - convergence}px`);
    // Glow blur radius, rather than filtering the marker and blurring its core.
    halo.style.setProperty("--halo-blur", `${12 - 11 * convergence}px`);
}

function deriveFutureMarkerModel(guidance, opacity) {
    const markers = [], diagnostics = [];
    if (guidance.context.mode === "FREE" || guidance.context.nextHarmony === null)
        return { markers, diagnostics };
    const visibleTargets = guidance.targets.filter(c => guidance.display.targets.includes(c.id));
    const scores = visibleTargets.map(c => c.score);
    const min = Math.min(...scores), max = Math.max(...scores);
    const targetByPitch = new Map(), targetById = new Map();
    // First candidate for each pitch is already R5's highest sorted candidate.
    for (const candidate of visibleTargets) {
        if (!targetByPitch.has(candidate.pitchClass)) {
            const strength = max === min ? 0.7 : (candidate.score - min) / (max - min);
            const model = { role: "target", pitchClass: candidate.pitchClass,
                candidateId: candidate.id, targetId: candidate.id,
                strength, sizeRatio: 0.18 + strength * 0.18, opacity };
            targetByPitch.set(candidate.pitchClass, model);
            markers.push(model);
        }
        // Every visible ID points to the actual marker for its pitch class.
        targetById.set(candidate.id, targetByPitch.get(candidate.pitchClass));
    }
    const drawnConnectors = new Set();
    for (const candidate of guidance.connectors.filter(c => guidance.display.connectors.includes(c.id))) {
        if (targetByPitch.has(candidate.pitchClass) || drawnConnectors.has(candidate.pitchClass)) continue;
        const route = guidance.routes.find(r => r.id === candidate.representativeRouteId);
        const target = route && targetById.get(route.targetId);
        if (!target) {
            diagnostics.push({ candidateId: candidate.id, routeId: candidate.representativeRouteId,
                reason: route ? "missing-visible-target" : "missing-representative-route" });
            continue; // No guessed fallback and no console spam.
        }
        drawnConnectors.add(candidate.pitchClass);
        markers.push({ role: "connector", pitchClass: candidate.pitchClass,
            candidateId: candidate.id, targetId: route.targetId,
            representativeRouteId: route.id, strength: target.strength,
            sizeRatio: target.sizeRatio, opacity: target.opacity });
    }
    return { markers, diagnostics };
}

function getFutureMarkerOpacity() {
    if (state.mode === "FREE") return 0.70;
    const playback = getPresetHarmonyPlayback();
    return deriveMarkerTemporalOpacity(playback, playback.unwrappedPosition, state.autoPlaying);
}

function renderFutureMarker(key, model) {
    const layer = Array.from(key.children).find(c => c.classList.contains("future-marker-layer"));
    let marker = layer.children[0];
    if (!model) {
        if (marker) marker.remove();
        return;
    }
    if (!marker) {
        marker = document.createElement("span");
        const halo = document.createElement("span");
        halo.className = "future-marker-halo";
        marker.appendChild(halo);
        layer.appendChild(marker);
    }
    marker.className = `future-marker ${model.role}`;
    marker.dataset.candidateId = model.candidateId;
    marker.dataset.targetId = model.targetId;
    marker.dataset.strength = String(model.strength);
    marker.dataset.sizeRatio = String(model.sizeRatio);
    // Black keys in the existing piano use absolute positioning; no input metadata changes.
    const black = key.classList.contains("absolute");
    marker.style.setProperty("--marker-diameter", `${model.sizeRatio * (black ? 1.4 : 1) * 100}%`);
    applyFutureMarkerHalo(marker.children[0], model.opacity);
}

function updateFutureMarkerOpacity() {
    // Existing display poll calls this without re-running R5 or rebuilding keys.
    const opacity = getFutureMarkerOpacity();
    document.querySelectorAll('[data-hand="rh"]').forEach(key => {
        const layer = Array.from(key.children).find(c => c.classList.contains("future-marker-layer"));
        if (layer.children[0]) applyFutureMarkerHalo(layer.children[0].children[0], opacity);
    });
}
// R7-2 END.

function updateLeftKeyHighlights() {
    // LH CURRENT stays accompaniment-based; manual CURRENT is a separate card.
    const current = getAccompanimentHarmony();
    const next = getNextStep();
    const nextOccurrence = state.mode === "FREE" ? null : getPresetHarmonyPlayback().nextOccurrence;
    const context = {
        currentPitchClass: noteIndex(state.mode === "FREE" ? state.currentRoot : current.root),
        nextPitchClass: state.mode === "FREE" || next === null ? null : noteIndex(next.root),
        connectorPitchClasses: state.mode === "FREE" ? [] :
            getConnectingChordCandidates().map(c => noteIndex(c.root))
    };
    const freeCandidates = state.mode === "FREE" ? getFreeChordGuidance().candidates : [];
    const keys = document.querySelectorAll('[data-hand="lh"]');
    keys.forEach(key => {
        const visual = deriveLeftKeyVisualState(noteIndex(key.dataset.note), context, key.classList.contains("active"));
        key.classList.toggle("lh-current", visual.semanticRole === "current");
        key.classList.toggle("lh-next", visual.semanticRole === "next");
        key.classList.toggle("lh-connect", visual.semanticRole === "connector");
        const candidate = freeCandidates.find(c=>noteIndex(c.root) === noteIndex(key.dataset.note));
        key.classList.toggle("lh-free-candidate", !!candidate);
        key.dataset.freeCandidateQuality = candidate?.quality || "";
        const label = Array.from(key.children).find(c=>c.classList.contains("free-chord-quality"));
        label.textContent = candidate ? `候補 ${candidate.quality}` : "";
        key.setAttribute("aria-label", candidate ? `${key.dataset.note} ${candidate.quality} 次コード候補` : key.dataset.note);
        // Preserve overlaps separately from the legacy background precedence.
        key.dataset.currentRoot = String(visual.current);
        key.dataset.nextRoot = String(visual.next);
        key.dataset.nextOccurrenceId = visual.next && nextOccurrence ? nextOccurrence.occurrenceId : "";
        key.dataset.connectingRoot = String(visual.connector);
    });

    const container = document.getElementById("lh-piano");
    let nextBtn = document.getElementById("lh-same-root-next");

    if (state.mode !== "FREE" && next !== null && normalizeNote(current.root) === normalizeNote(next.root)) {
        if (!nextBtn) {
            nextBtn = document.createElement("button");
            nextBtn.id = "lh-same-root-next";
            nextBtn.className = "next-button cursor-pointer";
            nextBtn.onclick = (e) => {
                e.stopPropagation();
                advanceChord();
            };
            container.appendChild(nextBtn);
        }
        nextBtn.textContent = `NEXT: ${formatHarmonySymbol(next)}`;
        nextBtn.style.display = "block";
    } else if (nextBtn) {
        nextBtn.style.display = "none";
    }
}

// QUALITY EXPANSION MODEL BEGIN: display tiers are independent of chord theory.
const PERMANENT_QUALITIES = Object.freeze(["7", "Maj", "m", "Maj7", "m7", "sus4", "dim", "aug", "add9", "6", "m6", "mMaj7", "m7b5", "9"]);
const ADVANCED_QUALITIES = Object.freeze(["Maj9", "m9", "11", "13", "dim7", "sus2", "7sus4", "7b5", "7#5", "7b9", "7#9", "Maj7#11"]);

function deriveQualityChoices({ currentQuality, accompanimentQuality = null, nextQuality = null, selectedQuality = null }) {
    const contextual = [...new Set([currentQuality, accompanimentQuality, nextQuality, selectedQuality])]
        .filter(q => ADVANCED_QUALITIES.includes(q));
    return { permanent: [...PERMANENT_QUALITIES], contextual,
        normal: [...PERMANENT_QUALITIES, ...contextual],
        advanced: ADVANCED_QUALITIES.filter(q => !contextual.includes(q)) };
}
// QUALITY EXPANSION MODEL END

let advancedQualityOpen = false;
let qualityButtonSignature = null;

function toggleAdvancedQuality() {
    advancedQualityOpen = !advancedQualityOpen;
    updateQualityButtonSelection();
}

function updateQualityButtonSelection() {
    const selected = getDisplayedQualitySelection();
    const choices = deriveQualityChoices({ currentQuality: getDisplayHarmony().quality,
        accompanimentQuality: getAccompanimentHarmony().quality,
        nextQuality: state.mode === "FREE" ? null : getNextStep()?.quality,
        selectedQuality: selected });
    const signature = JSON.stringify([choices.normal, choices.advanced]);
    if (signature !== qualityButtonSignature) {
        for (const [id, qualities] of [["quality-buttons", choices.normal], ["quality-advanced", choices.advanced]]) {
            const container = document.getElementById(id);
            container.innerHTML = "";
            qualities.forEach(q => {
                const btn = document.createElement("button");
                btn.type = "button";
                btn.textContent = q;
                btn.dataset.quality = q;
                btn.dataset.qualityTier = PERMANENT_QUALITIES.includes(q) ? "permanent" :
                    id === "quality-buttons" ? "contextual" : "advanced";
                btn.className = "py-1 rounded border text-[10px] font-mono font-bold bg-slate-950 border-slate-800 text-slate-400 hover:text-white transition cursor-pointer";
                btn.onclick = () => selectInputQuality(q);
                container.appendChild(btn);
            });
        }
        qualityButtonSignature = signature;
    }
    document.getElementById("quality-advanced").hidden = !advancedQualityOpen;
    updateBassControls();
    const more = document.getElementById("quality-more");
    more.textContent = advancedQualityOpen ? "閉じる" : "さらに";
    more.setAttribute("aria-expanded", String(advancedQualityOpen));
    for (const id of ["quality-buttons", "quality-advanced"]) {
        for (const btn of document.getElementById(id).children) {
            const active = btn.dataset.quality === selected;
            btn.setAttribute("aria-pressed", String(active));
            for (const className of ["bg-blue-600", "text-white", "border-blue-400"]) {
                btn.classList.toggle(className, active);
            }
        }
    }
}

// SLASH BASS UI BEGIN
function updateBassControls() {
    const controls = document.getElementById("bass-controls");
    controls.hidden = !advancedQualityOpen;
    const select = document.getElementById("bass-select");
    if (!select.children.length) {
        for (const note of ["", ...NOTE_NAMES]) {
            const option = document.createElement("option");
            option.value = note;
            option.textContent = note || "指定なし";
            select.appendChild(option);
        }
    }
    select.value = normalizeHarmonyBass(getDisplayHarmony().bass) ?? "";
    const container = document.getElementById("slash-contextual");
    const playback = state.mode === "FREE" ? null : getPresetHarmonyPlayback();
    const signature = playback ? JSON.stringify([playback.currentOccurrence, playback.nextOccurrence, state.key]) : "FREE";
    if (container.dataset.signature === signature) return;
    container.dataset.signature = signature;
    container.innerHTML = "";
    if (!playback) return;
    for (const [role, occurrence] of [["CURRENT", playback.currentOccurrence], ["NEXT", playback.nextOccurrence]]) {
        const harmony = getHarmonyFromOccurrence(occurrence);
        if (!harmony || harmony.bass === undefined || noteIndex(harmony.bass) === noteIndex(harmony.root)) continue;
        const button = document.createElement("button");
        button.type = "button";
        button.dataset.harmonyRole = role;
        button.textContent = `${role} ${formatHarmonySymbol(harmony)}`;
        button.onclick = () => {
            const live = getPresetHarmonyPlayback();
            const selected = role === "NEXT" ? live.nextOccurrence : live.currentOccurrence;
            if (selected && selected.occurrenceId === occurrence.occurrenceId) auditionPresetHarmony(selected, role === "NEXT");
        };
        container.appendChild(button);
    }
}
// SLASH BASS UI END

function buildQualityButtons() {
    qualityButtonSignature = null;
    updateQualityButtonSelection();
}

function buildRightPiano() {
    cleanupManualVoices("manual-right");
    const container = document.getElementById("rh-piano");
    container.innerHTML = "";

    const baseOctave = 4 + state.rhOctaveOffset;
    const octaves = [baseOctave, baseOctave + 1];

    const wrapper = document.createElement("div");
    wrapper.className = "flex w-full h-full gap-0.5";

    octaves.forEach(octave => {
        WHITE_NOTES.forEach(note => {
            wrapper.appendChild(createRightKey(note, octave, false));
        });
    });

    container.appendChild(wrapper);

    const totalWhite = 14;
    BLACK_NOTES.forEach(item => {
        octaves.forEach((octave, octIdx) => {
            const key = createRightKey(item.note, octave, true);
            const pos = octIdx * 7 + item.pos;
            const left = pos * (100 / totalWhite) - 2.4;
            key.style.left = `${left}%`;
            container.appendChild(key);
        });
    });

    document.getElementById("octave-display").textContent = `C${baseOctave}-B${baseOctave + 1}`;
    updateRightKeyHighlights();
}

function createRightKey(note, octave, isBlack) {
    const key = document.createElement("div");
    key.dataset.note = note;
    key.dataset.octave = octave;
    key.dataset.hand = "rh";

    key.className = isBlack
        ? "piano-key absolute top-0 w-[4.8%] h-[58%] bg-slate-900 border border-slate-700 rounded-b z-20 flex items-end justify-center pb-1 text-[7px] font-mono text-slate-300"
        : "piano-key flex-1 bg-slate-100 border border-slate-300 rounded-b flex items-end justify-center pb-1 text-[9px] font-mono font-bold text-slate-900";

    key.textContent = `${note}${octave}`;

    const futureLayer = document.createElement("span");
    futureLayer.className = "future-marker-layer";
    futureLayer.setAttribute("aria-hidden", "true");
    key.appendChild(futureLayer);
    const theoryLabel = document.createElement("span");
    theoryLabel.className = "note-role-label theory-label-layer";
    key.appendChild(theoryLabel);

    key.addEventListener("pointerdown", e => {
        beginManualPointer(e, key, "manual-right", { note, octave },
            timestamp => handleRightKey(note, octave, key, true, timestamp));
    });

    bindManualRelease(key);
    return key;
}

function handleRightKey(note, octave, element, held = false, timestamp = performance.now()) {
    state.lastRightNote = note;
    let groupId;
    if (held) {
        groupId = audio.createVoiceGroup("manual-right", { note, octave, timestamp }, true);
        audio.startTone(note, octave, 0.7, null, MIX_BALANCE.baseVelocity.manualMelody, groupId, true);
    } else groupId = audio.playTone(note, octave, 0.7, null, 0.3);
    scheduleRightVisualRefresh(); // R7-2.1: coalesced presentation after synchronous audio
    return groupId;
}

function updateRightKeyHighlights() {
    const context = {
        chordMetadata: deriveChordMetadata(getDisplayHarmony()),
        effectiveScale: getCurrentScaleContext().effectiveScale,
        guidance: getFutureGuidance()
    };
    const markerModel = deriveFutureMarkerModel(context.guidance, getFutureMarkerOpacity());
    const keys = document.querySelectorAll('[data-hand="rh"]');
    keys.forEach(key => {
        const visual = deriveRightKeyVisualState(noteIndex(key.dataset.note), context, key.classList.contains("active"));
        key.classList.toggle("rh-safe", visual.semanticRole === "chord");
        key.classList.toggle("rh-scale", visual.semanticRole === "scale");
        // Future role hooks never control the keyboard background.
        key.classList.remove("rh-target", "rh-connect");
        key.dataset.semanticRole = visual.semanticRole;
        key.dataset.futureTarget = String(visual.futureRoles.targets.length > 0);
        key.dataset.futureConnector = String(visual.futureRoles.connectors.length > 0);
        key.dataset.futureRole = visual.futureDisplayRole || "";
        renderKeyTheoryLabel(key.querySelector(".note-role-label"), visual.chordRole);
        renderFutureMarker(key, markerModel.markers.find(m => m.pitchClass === visual.pitchClass));
    });
}

function shiftRhOctave(delta) {
    state.rhOctaveOffset = Math.max(-2, Math.min(2, state.rhOctaveOffset + delta));
    buildRightPiano();
}

function renderProgressionPills() {
    const container = document.getElementById("progression-pills");
    container.innerHTML = "";

    const progression = getProgression();
    const activeSection = getProgressionSectionIndex();
    progression.forEach((chord, i) => {
        const pill = document.createElement("button");
        pill.className = `px-3 py-1.5 rounded-lg border text-xs font-mono font-bold flex items-center gap-1.5 transition shrink-0 cursor-pointer ${
            i === activeSection
                ? "bg-blue-600 text-white border-blue-400 shadow-md scale-105"
                : "bg-slate-950 text-slate-400 border-slate-800 hover:border-slate-700"
        }`;

        pill.onclick = () => {
            if (state.mode === "FREE") {
                state.freePlayback.chordIndex = i;
                state.freePlayback.nextStep = 0;
            } else {
                seekPresetHarmonySection(i);
            }
            const step = getAccompanimentHarmony();
            state.currentRoot = step.root;
            state.currentQuality = step.quality;
            setManualBassChoice(step.root, step.bass);
            playManualHarmony(step);
            updateUI();
        };

        const degreeSpan = document.createElement("span");
        degreeSpan.className = "text-[9px] opacity-75 font-normal";
        degreeSpan.textContent = `[${i + 1}]`;

        const nameSpan = document.createElement("span");
        nameSpan.textContent = formatHarmonySymbol(chord);

        pill.appendChild(degreeSpan);
        pill.appendChild(nameSpan);
        container.appendChild(pill);
    });
}

function renderBeatIndicator() {
    updateFutureMarkerOpacity(); // R7-2: read Timeline time on the existing display poll.
    const container = document.getElementById("beat-indicator");
    container.innerHTML = "";

    const rhythm = getActiveRhythm();
    const totalSteps = rhythm.beatsPerBar * rhythm.stepsPerBeat;
    const playback = state.mode === "FREE" ? null : getPresetHarmonyPlayback();
    const localPosition = playback?.timelinePosition;
    const step = playback === null ? state.freePlayback.nextStep
        : (playback.terminal ? localPosition - 1 / rhythm.stepsPerBeat : localPosition) * rhythm.stepsPerBeat;
    const currentStepInBar = Math.floor(step % totalSteps);

    for (let i = 0; i < totalSteps; i++) {
        const dot = document.createElement("div");
        dot.className = `beat-dot ${i === currentStepInBar ? "beat-active" : ""}`;
        container.appendChild(dot);
    }

    const label = document.createElement("span");
    label.className = "beat-label";
    const currentBeatNumber = Math.floor(currentStepInBar / rhythm.stepsPerBeat) + 1;
    label.textContent = `Beat ${currentBeatNumber} / ${rhythm.beatsPerBar}${playback?.terminal ? " · End" : ""}`;
    container.appendChild(label);
}

// R7-4 BEGIN: UI-only sheet and catalog presentation. No input/audio/clock hooks.
const uiState = { settingsSheetOpen: false, explorerStage: "category", layer: "", category: "", trigger: null, savedOverflow: "" };

function openSettingsSheet(trigger) {
    if (!uiState.settingsSheetOpen) {
        uiState.trigger = trigger || document.activeElement;
        uiState.savedOverflow = document.body.style.overflow;
        document.body.style.overflow = "hidden";
    }
    uiState.settingsSheetOpen = true;
    uiState.layer = state.catalogLayer;
    uiState.category = state.catalogCategory;
    uiState.explorerStage = "category";
    document.getElementById("settings-sheet").dataset.open = "true";
    document.getElementById("settings-sheet").setAttribute("aria-hidden", "false");
    document.getElementById("settings-backdrop").dataset.open = "true";
    for (const id of ["settings-toggle", "current-preset"]) document.getElementById(id).setAttribute("aria-expanded", "true");
    const preset = getPreset();
    document.getElementById("explorer-current").textContent = "現在：" + preset.name + " — " + (preset.description || "");
    renderPresetExplorer();
    document.getElementById("advanced-controls").scrollTop = 0;
    document.getElementById("settings-close").focus?.({ preventScroll: true });
}

function closeSettingsSheet() {
    if (!uiState.settingsSheetOpen) return;
    uiState.settingsSheetOpen = false;
    document.getElementById("settings-sheet").dataset.open = "false";
    document.getElementById("settings-sheet").setAttribute("aria-hidden", "true");
    document.getElementById("settings-backdrop").dataset.open = "false";
    for (const id of ["settings-toggle", "current-preset"]) document.getElementById(id).setAttribute("aria-expanded", "false");
    document.body.style.overflow = uiState.savedOverflow;
    uiState.trigger?.focus?.({ preventScroll: true });
}

function handleSettingsSheetKey(event) {
    if (!uiState.settingsSheetOpen) return;
    if (event.key === "Escape") { event.preventDefault(); closeSettingsSheet(); }
    if (event.key === "Tab") {
        const items = [...document.getElementById("settings-sheet").querySelectorAll('button, select, input')].filter(el => el.checkVisibility({ visibilityProperty: true }));
        const first = items[0], last = items[items.length - 1];
        if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
        else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
    }
}

// Explorer uses the existing three stages; no separate navigation history.
function getParentExplorerStage(stage) {
    if (stage === "preset") return "subcategory";
    if (stage === "subcategory") return "category";
    if (stage === "category") return null;
    throw new RangeError("Unknown Explorer stage");
}

function handleExplorerBack() {
    const parent = getParentExplorerStage(uiState.explorerStage);
    if (parent !== null) showExplorerStage(parent);
}

function showExplorerStage(stage, layer = uiState.layer, category = uiState.category) {
    uiState.explorerStage = stage; uiState.layer = layer; uiState.category = category;
    renderPresetExplorer();
    document.getElementById("advanced-controls").scrollTop = 0;
    document.getElementById("explorer-list").firstElementChild?.focus?.({ preventScroll: true });
}

function renderPresetExplorer() {
    const path = document.getElementById("explorer-path"), list = document.getElementById("explorer-list");
    path.innerHTML = ""; list.innerHTML = "";
    document.getElementById("explorer-back").hidden = getParentExplorerStage(uiState.explorerStage) === null;
    const button = (parent, title, description, current, action) => {
        const el = document.createElement("button"); el.type = "button"; el.className = "explorer-item";
        el.textContent = title; el.setAttribute("aria-current", String(current));
        if (description) { const sub = document.createElement("span"); sub.textContent = description; el.appendChild(sub); }
        el.onclick = action; parent.appendChild(el); return el;
    };
    button(path, "分類", "", uiState.explorerStage === "category", () => showExplorerStage("category"));
    if (uiState.explorerStage !== "category") button(path, uiState.layer, "", uiState.explorerStage === "subcategory", () => showExplorerStage("subcategory"));
    if (uiState.explorerStage === "preset") button(path, uiState.category, "", true, () => showExplorerStage("preset"));
    if (uiState.explorerStage === "category") {
        for (const layer of Object.keys(CHORD_TOY_CATALOG)) button(list, layer, layer === state.catalogLayer ? "現在の分類" : "", layer === state.catalogLayer,
            () => showExplorerStage("subcategory", layer, layer === state.catalogLayer ? state.catalogCategory : Object.keys(CHORD_TOY_CATALOG[layer])[0]));
    } else if (uiState.explorerStage === "subcategory") {
        for (const category of Object.keys(CHORD_TOY_CATALOG[uiState.layer])) button(list, category, "", uiState.layer === state.catalogLayer && category === state.catalogCategory,
            () => showExplorerStage("preset", uiState.layer, category));
    } else {
        // Same catalog membership as populatePresets; presentation only, never reset transport while browsing.
        const matched = PRESETS.filter(p => (p.tags || []).some(tag => tag[0] === uiState.layer && tag[1] === uiState.category));
        const fallback = PRESETS.filter(p => p.category === uiState.category || p.category === uiState.layer);
        for (const preset of matched.length ? matched : fallback.length ? fallback : PRESETS) {
            const item = button(list, preset.name, preset.description, preset.id === state.presetId, () => selectExplorerPreset(preset.id));
            item.dataset.presetId = preset.id;
        }
    }
}

function selectExplorerPreset(id) {
    // Existing catalog population and the official selection path own every musical side effect.
    state.catalogLayer = uiState.layer; state.catalogCategory = uiState.category;
    populateCatalogLayers();
    document.getElementById("preset-select").value = id;
    loadPresetFromUI();
    document.getElementById("explorer-current").textContent = "現在：" + getPreset().name + " — " + (getPreset().description || "");
    renderPresetExplorer();
    [...document.getElementById("explorer-list").children].find(item => item.dataset.presetId === id)?.focus?.({ preventScroll: true });
}
// R7-4 END.

function updateUI() {
    return withPresetClockSnapshot(() => {
        if (state.mode !== "FREE") syncPresetTransportFromClock();
        const preset = getPreset();
        document.getElementById("current-preset-name").textContent = preset.name; // R7-3 compact preset
        document.getElementById("current-preset-description").textContent = preset.description || ""; // R7-3 compact preset
        const display = getDisplayHarmony();
        const accompaniment = getAccompanimentHarmony();
        const next = getNextStep();

        document.getElementById("current-chord").textContent = formatHarmonySymbol(display);
        // Compatibility: T/SD/D is preset metadata, not an inferred manual function.
        document.getElementById("current-function").textContent = state.mode === "FREE" ? "FREE" : accompaniment.function;

        document.getElementById("next-chord").textContent = state.mode === "FREE" || next === null ? "-" : formatHarmonySymbol(next);
        document.getElementById("next-function").textContent = state.mode === "FREE" || next === null ? "-" : next.function;
        const loopButton = document.getElementById("loop-button");
        loopButton.textContent = state.playbackPolicy.loopEnabled ? "Loop ON" : "Loop OFF";
        loopButton.setAttribute("aria-pressed", String(state.playbackPolicy.loopEnabled));
        loopButton.disabled = state.mode === "FREE";

        const progression = getProgression();
        document.getElementById("bar-info").textContent = `${getProgressionSectionIndex() + 1} / ${progression.length}`;

        document.getElementById("lh-root-label").textContent = `${state.currentRoot}3`;

        document.getElementById("info-bpm").textContent = state.bpm;
        document.getElementById("info-meter").textContent = preset.meter || "4/4";
        document.getElementById("info-bars").textContent = preset.bars || progression.length;
        document.getElementById("info-style").textContent = preset.category || "基本";

        updateQualityButtonSelection();
        updateLeftKeyHighlights();
        updateRightKeyHighlights();
        renderProgressionPills();
        renderBeatIndicator();
    });
}

function toggleAutoPlay() {
    if (state.autoPlaying) {
        stopAutoPlay();
    } else {
        startAutoPlay();
    }
}

function startAutoPlay() {
    if (state.mode !== "FREE" && state.autoPlaying) commitPresetClockPosition();
    if (state.mode !== "FREE") {
        getPresetHarmonyPlayback(); // Fail before starting unresolved playback.
        if (state.presetPlayback.terminal) {
            clearManualHarmony("PRESET");
            resetPresetPlaybackPosition();
            const first = getAccompanimentHarmony();
            state.currentRoot = first.root;
            state.currentQuality = first.quality;
            updateUI();
        }
    }
    audio.resume();
    state.autoPlaying = true;

    const autoBtn = document.getElementById("auto-button");
    if (autoBtn) {
        autoBtn.textContent = "⏸ 停止";
        autoBtn.classList.add("auto-active");
    }

    resetAutoPlayTimer();
    restartAccompanimentScheduling();
}

function stopAutoPlay() {
    const wasPlaying = state.autoPlaying;
    if (state.mode !== "FREE" && state.autoPlaying) {
        commitPresetClockPosition();
        applyPendingAccompanimentStyle(state.presetPlayback.position);
    }
    accompanimentScheduler.stop();
    audio.releaseOwner("accompaniment");
    audio.releaseOwner("drums");
    state.autoPlaying = false;
    if (state.autoTimer) {
        clearInterval(state.autoTimer);
        state.autoTimer = null;
    }

    const autoBtn = document.getElementById("auto-button");
    if (autoBtn) {
        autoBtn.textContent = "▶ 再生";
        autoBtn.classList.remove("auto-active");
    }
    if (wasPlaying && state.mode !== "FREE") updateUI();
}

function autoPlayTick() {
    if (!state.autoPlaying) return; // Ignore a queued callback after Stop/end.
    const rhythm = getActiveRhythm();

    if (state.mode === "FREE") {
        // FREE preserves its legacy clock/position behavior until its Play contract is decided.
        const timeline = getResolvedPresetHarmonyTimeline();
        const targetChordIndex = deriveHarmonyPlaybackPosition(timeline, { loopEnabled: true },
            state.freePlayback.nextStep / rhythm.stepsPerBeat).currentOccurrence.sectionIndex;
        if (targetChordIndex !== state.chordIndex) {
            state.freePlayback.chordIndex = targetChordIndex;
            const current = getAccompanimentHarmony();
            state.currentRoot = current.root;
            state.currentQuality = current.quality;
            updateUI();
        }
    } else {
        withPresetClockSnapshot(() => {
            const position = getPresetClockPosition();
            const transitioned = syncPresetTransportFromClock(position);
            const changedStyle = applyPendingAccompanimentStyle(getPresetRenderClockPosition());
            if (state.presetPlayback.terminal) { stopAutoPlay(); return; }
            if (transitioned || changedStyle) updateUI();
            else renderBeatIndicator();
            accompanimentScheduler.pump();
        });
        return; // PRESET polls read elapsed Audio time; FREE below retains its legacy step clock.
    }
    const position = state.mode === "FREE" ? state.freePlayback.nextStep / rhythm.stepsPerBeat
        : state.presetPlayback.position;
    const pendingPosition = state.mode === "FREE" && position === 0 &&
        accompanimentStyleState.pendingStyle?.boundaryBeat >= getResolvedPresetHarmonyTimeline().endBeat
        ? getResolvedPresetHarmonyTimeline().endBeat : position;
    const changedStyle = applyPendingAccompanimentStyle(pendingPosition);
    if (state.mode === "FREE") {
        if (changedStyle) state.freePlayback.nextStep = position * getActiveRhythm().stepsPerBeat;
        playFreeAccompanimentStep(position);
    } else accompanimentScheduler.pump();
    if (changedStyle) updateUI();

    renderBeatIndicator();

    if (state.mode === "FREE") {
        const totalBeatsInPreset = getResolvedPresetHarmonyTimeline().endBeat;
        const totalStepsInPreset = totalBeatsInPreset * getActiveRhythm().stepsPerBeat;
        state.freePlayback.nextStep = (state.freePlayback.nextStep + 1) % totalStepsInPreset;
    }
}

window.onload = function() {
    populateCatalogLayers();
    populateKeys();
    populateRhythms();

    const initialPreset = getPreset();
    state.bpm = initialPreset.bpm;
    state.currentRoot = getProgression()[0].root;
    state.currentQuality = getProgression()[0].quality;

    document.getElementById("bpm-input").value = state.bpm;

    buildLeftPiano();
    buildQualityButtons();
    buildRightPiano();
    updateUI();
};
</script>
