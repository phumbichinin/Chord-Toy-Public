<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no,
               viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">

<title>Chord Toy ver.11.2</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
/* Analog Instrument Palette: initial device-tuning values.
   Music roles, neutral UI, and interaction states have separate ownership. */
:root {
    --music-current-chord: #E5AD58;
    --music-current-scale: #D8C8A8;
    --music-future-target: #8BAC7C;
    --music-future-passing: #B9CBB2;
    --music-key-text: #17191B;
    --music-marker-edge: #25282A;
    --ui-background: #17191B;
    --ui-surface: #25282A;
    --ui-text-primary: #EAE3D6;
    --ui-text-secondary: #929490;
    --ui-divider: #383A3B;
    /* Existing controls retain their state colors; never alias music tokens. */
    --state-playing: #dc2626;
    --state-playing-text: #ffffff;
    --state-stopped: #f59e0b;
    --state-stopped-hover: #fbbf24;
    --state-stopped-text: #020617;
    --state-selected: #4f46e5;
    --state-selected-text: #ffffff;
    --state-selected-shadow: rgba(79,70,229,0.3);
    --state-quality-selected: #2563eb;
    --state-quality-selected-edge: #60a5fa;
    --state-explorer-selected-edge: #a78bfa;
    --state-explorer-selected-surface: #4c1d9533;
    --state-pressed-transform: translateY(2px) scale(0.98);
    --state-disabled-opacity: 0.32;
    --state-beat: #f59e0b;
    --state-beat-edge: #fbbf24;
    --state-beat-shadow: rgba(245,158,11,0.65);
    /* LH connecting chords and FREE choices are NOT Future melody roles.
       Keep their existing palette pending a separate role/color decision. */
    --lh-connecting-chord: #818cf8;
    --lh-connecting-text: #1e1b4b;
    --lh-connecting-edge: #a5b4fc;
    --lh-connecting-shadow: rgba(129,140,248,0.45);
    --lh-free-choice: #e0e7f2;
    --lh-free-choice-text: #334155;
    --lh-free-choice-edge: #a5b4cc;
    --lh-free-choice-black: #334155;
    --lh-free-choice-black-text: #cbd5e1;
}

* {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    touch-action: manipulation;
}

html,
body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: var(--ui-background);
    color: var(--ui-text-primary);
    font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        sans-serif;
}

body {
    overflow-x: hidden;
}

.piano-key {
    position: relative;
    cursor: pointer;
    transition:
        transform 0.05s ease,
        background-color 0.12s ease,
        box-shadow 0.12s ease,
        border-color 0.12s ease,
        opacity 0.12s ease;
}

/* Keyboard performance owns pan/zoom gestures; other page areas retain scrolling.
   Container dblclick defaults are also suppressed without changing pointer input. */
#lh-piano, #rh-piano,
#lh-piano .piano-key, #rh-piano .piano-key {
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
}

/* Press feedback only: semantic/future classes remain intact while held. */
.piano-key:active,
.piano-key.active {
    transform: var(--state-pressed-transform);
}

.lh-current {
    background: var(--music-current-chord) !important;
    color: var(--music-key-text) !important;
    border-color: var(--music-current-chord) !important;
    box-shadow: inset 0 0 0 1px var(--music-key-text) !important;
    font-weight: 900;
}

/* FREE CHORD GUIDANCE CSS BEGIN: optional chord choices, distinct from fixed NEXT. */
.lh-free-candidate {
    background: var(--lh-free-choice) !important;
    color: var(--lh-free-choice-text) !important;
    border-color: var(--lh-free-choice-edge) !important;
    box-shadow: inset 0 0 0 1px var(--lh-free-choice-edge);
}
.piano-key.absolute.lh-free-candidate {
    background: var(--lh-free-choice-black) !important;
    color: var(--lh-free-choice-black-text) !important;
}
.free-chord-quality {
    position: absolute;
    bottom: 24px;
    font-size: 8px;
    font-weight: 500;
    pointer-events: none;
    opacity: 0.8;
}
/* FREE CHORD GUIDANCE CSS END. */

.lh-connect {
    background: var(--lh-connecting-chord) !important;
    color: var(--lh-connecting-text) !important;
    border-color: var(--lh-connecting-edge) !important;
    box-shadow: 0 0 13px var(--lh-connecting-shadow) !important;
    font-weight: 900;
}

.lh-next {
    background: var(--music-future-target) !important;
    color: var(--music-key-text) !important;
    border-color: var(--music-future-target) !important;
    box-shadow: inset 0 0 0 1px var(--music-key-text) !important;
    font-weight: 900;
}

.lh-disabled {
    opacity: var(--state-disabled-opacity);
}

.rh-safe {
    background: var(--music-current-chord) !important;
    color: var(--music-key-text) !important;
    border-color: var(--music-current-chord) !important;
    box-shadow: inset 0 0 0 1px var(--music-key-text) !important;
    font-weight: 800;
}

.rh-scale {
    background: var(--music-current-scale) !important;
    color: var(--music-key-text) !important;
    border-color: var(--music-current-scale) !important;
    box-shadow: inset 0 0 0 1px var(--music-key-text) !important;
    font-weight: 800;
}

/* R7-1: future roles are data, never keyboard background colors.
   This overlay is the rendering boundary for R7-2 marker children. */
.future-marker-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
}
.future-marker-layer * { pointer-events: none; }

/* R7-2 CSS BEGIN: initial visual tuning; independent of key meaning/press. */
.future-marker-layer { z-index: 40; }
.future-marker {
    position: absolute;
    left: 50%;
    bottom: 14px;
    transform: translateX(-50%);
    width: clamp(8px, var(--marker-diameter), 22px);
    aspect-ratio: 1;
    border-radius: 50%;
    border: 1px solid var(--music-marker-edge);
    pointer-events: none;
    opacity: 1;
}
.piano-key:not(.absolute) .future-marker { bottom: 18px; }
.future-marker.target { background: var(--music-future-target); }
.future-marker.connector { background: var(--music-future-passing); }
.future-marker-halo {
    position: absolute;
    inset: -2px;
    border-radius: 50%;
    border: var(--halo-border-width, 1.333333px) solid var(--music-future-passing);
    box-shadow: 0 0 var(--halo-blur, 4.666667px) var(--music-future-passing);
    transform: scale(var(--halo-scale, 1.28));
    pointer-events: none;
}
/* R7-2 CSS END. */

.beat-dot {
    width: 8px;
    height: 8px;
    border-radius: 999px;
    background: var(--ui-divider);
    border: 1px solid var(--ui-divider);
    transition: transform 0.08s ease, background 0.08s ease, box-shadow 0.08s ease;
}

.beat-dot.beat-active {
    background: var(--state-beat);
    border-color: var(--state-beat-edge);
    box-shadow: 0 0 9px var(--state-beat-shadow);
    transform: scale(1.3);
}

.beat-label {
    margin-left: 6px;
    color: var(--ui-text-secondary);
    font-family: monospace;
    font-size: 9px;
}

.next-button {
    position: absolute;
    left: 50%;
    bottom: -34px;
    transform: translateX(-50%);

    min-width: 58px;
    height: 28px;

    border-radius: 7px;
    border: 1px solid var(--music-future-target);

    background: var(--music-future-target);
    color: var(--music-key-text);

    font-size: 9px;
    font-weight: 900;
    letter-spacing: 0.5px;

    box-shadow:
        0 3px 8px rgba(0,0,0,0.45),
        0 0 12px var(--music-future-target);

    z-index: 100;

    transition:
        transform 0.05s ease,
        background 0.12s ease;
}

.next-button:active {
    transform: translateX(-50%) translateY(2px) scale(0.96);
    background: var(--music-future-target);
}

.next-button::before {
    content: "";
    position: absolute;
    top: -6px;
    left: 50%;
    transform: translateX(-50%);

    border-left: 5px solid transparent;
    border-right: 5px solid transparent;
    border-bottom: 6px solid var(--music-future-target);
}

.note-role-label {
    position: absolute;
    top: 5px;
    left: 50%;
    transform: translateX(-50%);

    font-size: 8px;
    line-height: 1;

    padding: 2px 4px;
    border-radius: 4px;

    pointer-events: none;
    white-space: nowrap;
    z-index: 50;
}

/* Theory text reads chord metadata, independently of future and press roles. */
.note-role-label {
    color: inherit;
}

::-webkit-scrollbar {
    width: 6px;
    height: 6px;
}

::-webkit-scrollbar-track {
    background: var(--ui-surface);
}

::-webkit-scrollbar-thumb {
    background: var(--ui-divider);
    border-radius: 3px;
}

@media (min-width: 768px) and (orientation: landscape) {
    .keyboard-layout {
        display: grid !important;
        grid-template-columns: minmax(0, 5fr) minmax(0, 7fr) !important;
    }

    .lh-section,
    .rh-section {
        min-width: 0;
    }
}

@media (min-width: 900px) and (orientation: landscape) {
    .keyboard-layout {
        display: grid !important;
        grid-template-columns: minmax(0, 5fr) minmax(0, 7fr) !important;
    }
}

@media (max-width: 767px) {
    .keyboard-layout {
        display: grid !important;
        grid-template-columns: 1fr !important;
    }
}

.lh-keyboard-area {
    padding-bottom: 42px;
}

@keyframes subtlePulse {
    0%, 100% {
        box-shadow: inset 0 0 0 1px var(--music-future-target);
    }
    50% {
        box-shadow: inset 0 0 0 2px var(--music-future-passing);
    }
}

.lh-next {
    animation: subtlePulse 1.8s infinite;
}

.auto-active {
    background: var(--state-playing) !important;
    color: var(--state-playing-text) !important;
}

.mode-active {
    background: var(--state-selected) !important;
    color: var(--state-selected-text) !important;
    font-weight: 800;
    box-shadow: 0 2px 8px var(--state-selected-shadow);
}

@media (max-width: 480px) {
    .lh-section,
    .rh-section {
        padding: 10px !important;
    }

    .piano-key {
        font-size: 8px;
    }

    .next-button {
        min-width: 52px;
    }
}
/* SLASH BASS CSS BEGIN */
#bass-controls { margin-top: 8px; display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--ui-text-secondary); }
#bass-controls[hidden] { display: none; }
#bass-select { min-height: 36px; padding: 4px 8px; border: 1px solid var(--ui-divider); border-radius: 6px; background: var(--ui-background); color: var(--ui-text-primary); }
.slash-contextual { display: flex; flex-wrap: wrap; gap: 4px; }
.slash-contextual button { min-height: 36px; margin-top: 4px; padding: 4px 8px; border: 1px solid var(--ui-divider); border-radius: 6px; color: var(--ui-text-primary); font-size: 11px; }
/* SLASH BASS CSS END */

/* QUALITY EXPANSION CSS BEGIN */
#quality-advanced { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; margin-top: 4px; }
#quality-advanced[hidden] { display: none; }
#quality-more, #quality-advanced button { min-height: 36px; }
#quality-more { margin-top: 4px; padding: 4px 10px; border: 1px solid var(--ui-divider); border-radius: 6px; color: var(--ui-text-secondary); font-size: 11px; }
/* QUALITY EXPANSION CSS END */

/* R7-3 CSS BEGIN: initial performance layout tuning, no key/marker semantics. */
:root { --performance-gap: 10px; --lh-height: clamp(120px, 16vh, 140px); --rh-height: clamp(150px, 22vh, 190px); }
.performance-header { position: sticky; top: 0; z-index: 60; background: var(--ui-background); border-bottom: 1px solid var(--ui-divider); padding: calc(6px + env(safe-area-inset-top)) 12px 6px; }
.performance-toolbar { max-width: 1280px; margin: auto; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 6px 10px; align-items: center; }
.performance-title { font-size: 13px; font-weight: 800; white-space: nowrap; }
.current-preset { min-width: 0; text-align: left; color: var(--ui-text-primary); }
.current-preset span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#current-preset-name { font-size: 12px; font-weight: 700; }
#current-preset-description { font-size: 10px; color: var(--ui-text-secondary); }
.transport-controls { display: flex; gap: 6px; grid-column: 2; grid-row: 2; }
.mode-controls { display: flex; gap: 2px; grid-column: 1; grid-row: 2; }
#settings-toggle { grid-column: 3; grid-row: 1 / 3; border: 1px solid var(--ui-divider); border-radius: 8px; padding: 0 10px; font-size: 12px; }
.performance-header button, .octave-controls button, #quality-buttons button { min-height: 36px; }
.performance-main { max-width: 1280px; margin: auto; padding: 10px 12px calc(12px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: var(--performance-gap); }
.performance-strip { padding: 8px 10px !important; }
.status-layout { display: grid; grid-template-columns: 1fr; gap: 6px; }
.harmony-pair { display: flex; align-items: center; gap: 8px; }
.harmony-card { display: flex; align-items: baseline; gap: 7px; min-width: 0; padding: 3px 7px; border-radius: 8px; background: var(--ui-background); border: 1px solid var(--ui-divider); }
.current-card { border-color: var(--music-current-chord); }.next-card { border-color: var(--ui-divider); }
#current-chord, #next-chord { font-size: 19px; line-height: 1.25; }
.progress-area { min-width: 0; }
.progress-caption { display: flex; justify-content: space-between; margin-bottom: 3px; }
#progression-pills { gap: 5px; padding: 2px 2px 4px; }
#progression-pills button { min-height: 32px; padding: 4px 8px; }
#beat-indicator { margin-top: 2px; min-height: 14px; }
.keyboard-layout { gap: var(--performance-gap); }
.lh-section, .rh-section { padding: 10px !important; min-width: 0; }
.keyboard-heading { display: flex; justify-content: space-between; align-items: center; gap: 6px; margin-bottom: 6px; min-height: 36px; }
.keyboard-heading h2 { font-size: 12px; white-space: nowrap; }
.lh-keyboard-area { padding-bottom: 36px; }
#lh-piano { height: var(--lh-height); }#rh-piano { height: var(--rh-height); }
.quality-controls { margin-top: 0; }
#quality-buttons { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; }
.octave-controls { display: flex; align-items: center; gap: 4px; }.octave-controls button { min-width: 36px; }
#octave-display { padding: 0 3px; white-space: nowrap; }
.keyboard-legend { display: flex; flex-wrap: wrap; gap: 4px 8px; padding-top: 7px; font-size: 9px; color: var(--ui-text-secondary); }
.advanced-controls { scroll-margin-top: calc(100px + env(safe-area-inset-top)); border: 1px solid var(--ui-divider); border-radius: 10px; padding: 8px 10px; color: var(--ui-text-secondary); }
.advanced-controls summary { min-height: 36px; cursor: pointer; padding: 8px 0; font-size: 12px; }
.advanced-controls[open] { display: block; }
.advanced-controls section { margin-top: 10px; }
.sound-controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 12px; }
.sound-controls button, .sound-controls select { min-height: 36px; }
.performance-help { font-size: 10px; line-height: 1.8; padding: 10px; }
@media (min-width: 768px) and (orientation: landscape) {
    :root { --lh-height: clamp(176px, 36vh, 300px); --rh-height: clamp(176px, 36vh, 300px); }
    .performance-toolbar { grid-template-columns: auto minmax(0, 1fr) auto auto auto; }
    .transport-controls, .mode-controls, #settings-toggle { grid-column: auto; grid-row: auto; }
    .status-layout { grid-template-columns: auto minmax(0, 1fr); gap: 16px; align-items: center; }
    .keyboard-heading { margin-bottom: 10px; }
}
/* R7-3 CSS END. */
/* R7-4 CSS BEGIN: overlay and explorer presentation only. */
.settings-backdrop { position: fixed; inset: 0; z-index: 100; background: rgb(23 25 27 / 38%); opacity: 0; visibility: hidden; transition: opacity 220ms ease, visibility 220ms; }
.settings-sheet { position: fixed; z-index: 110; bottom: 0; left: 50%; width: min(100%, 860px); max-height: 76vh; max-height: 76dvh; display: flex; flex-direction: column; border: 1px solid var(--ui-divider); border-radius: 18px 18px 0 0; background: var(--ui-surface); box-shadow: 0 -8px 32px #17191B55; transform: translate(-50%, 100%); visibility: hidden; transition: transform 220ms ease, visibility 220ms; }
.settings-sheet[data-open="true"] { transform: translate(-50%, 0); visibility: visible; transition: transform 220ms ease; }
.settings-backdrop[data-open="true"] { opacity: 1; visibility: visible; }
.sheet-handle { width: 36px; height: 4px; border-radius: 4px; background: var(--ui-text-secondary); margin: 8px auto 0; flex-shrink: 0; }
.sheet-header { display: flex; align-items: center; justify-content: space-between; padding: 8px 16px; border-bottom: 1px solid var(--ui-divider); flex-shrink: 0; }
.sheet-header h2 { font-size: 15px; font-weight: 700; }
.sheet-header button { min-height: 40px; padding: 6px 12px; border: 1px solid var(--ui-divider); border-radius: 8px; }
.sheet-scroll { overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y; padding: 12px 16px calc(16px + env(safe-area-inset-bottom)); }
.sheet-group { margin-bottom: 20px; }
.sheet-group h3 { font-size: 11px; font-weight: 700; letter-spacing: .08em; color: var(--ui-text-secondary); margin-bottom: 8px; }
.explorer-list { display: grid; gap: 6px; }
.explorer-item { text-align: left; border: 1px solid var(--ui-divider); border-radius: 10px; padding: 10px 12px; min-height: 44px; color: var(--ui-text-primary); background: var(--ui-background); }
.explorer-item[aria-current="true"] { border-color: var(--state-explorer-selected-edge); background: var(--state-explorer-selected-surface); }
.explorer-item span { display: block; font-size: 11px; color: var(--ui-text-secondary); margin-top: 3px; }
.explorer-path { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; font-size: 12px; }
.explorer-path button { min-height: 36px; padding: 4px 8px; border: 1px solid var(--ui-divider); border-radius: 6px; }
.explorer-navigation { display: flex; align-items: flex-start; gap: 6px; }
.explorer-navigation .explorer-path { flex: 1; min-width: 0; }
#explorer-back { flex-shrink: 0; min-width: 44px; text-align: center; }
#explorer-back[hidden] { display: none; }
.catalog-bridge { display: none; }
.music-controls { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.music-controls label { font-size: 11px; color: var(--ui-text-secondary); }
.music-controls select, .music-controls input { display: block; width: 100%; margin-top: 4px; min-height: 40px; background: var(--ui-background); border: 1px solid var(--ui-divider); border-radius: 8px; padding: 8px; font-size: 12px; }
@media (max-width: 600px) { .settings-sheet { max-height: 84vh; max-height: 84dvh; } .music-controls { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: reduce) { .settings-sheet, .settings-sheet[data-open="true"], .settings-backdrop { transition: none; } }
/* R7-4 CSS END. */
/* R7 visual polish: LH width initial tuning; RH keeps full available width. */
#lh-piano { width: min(100%, 620px); margin-inline: auto; }

/* Palette adapters for retained Tailwind markup and generated controls.
   Quality selection is an operation state; active progression is current music. */
.music-current-text { color: var(--music-current-chord); }
.music-future-text { color: var(--music-future-target); }
.music-current-chord-fill { background: var(--music-current-chord); }
.music-current-scale-fill { background: var(--music-current-scale); }
.music-future-target-fill { background: var(--music-future-target); }
.music-future-passing-fill { background: var(--music-future-passing); }
#current-chord { font-size: 21px; color: var(--music-current-chord); }
#next-chord { color: var(--music-future-target); font-weight: 700; }
#lh-root-label { background: var(--ui-background); border-color: var(--music-current-chord); }
#performance-status, .performance-main .lh-section, .performance-main .rh-section { background: var(--ui-surface); border-color: var(--ui-divider); }
body .bg-slate-950, body .bg-slate-900 { background-color: var(--ui-background); }
body .bg-slate-800 { background-color: var(--ui-surface); }
body .border-slate-800, body .border-slate-700 { border-color: var(--ui-divider); }
body .text-slate-200, body .text-slate-300 { color: var(--ui-text-primary); }
body .text-slate-400, body .text-slate-500, body .text-slate-600 { color: var(--ui-text-secondary); }
/* Semantic !important fills still win; neutral notes remain freely playable. */
.piano-key:not(.absolute) { background-color: var(--ui-text-primary); color: var(--ui-background); border-color: var(--ui-divider); }
.piano-key.absolute { background-color: var(--ui-surface); color: var(--ui-text-primary); border-color: var(--ui-divider); }
#progression-pills .bg-blue-600 { background: var(--music-current-chord); color: var(--music-key-text); border-color: var(--music-current-chord); }
#quality-buttons [aria-pressed="true"], #quality-advanced [aria-pressed="true"] { background: var(--state-quality-selected); color: var(--state-selected-text); border-color: var(--state-quality-selected-edge); }
#auto-button:not(.auto-active) { background: var(--state-stopped); color: var(--state-stopped-text); }
#auto-button:not(.auto-active):hover { background: var(--state-stopped-hover); }
</style>
</head>

<body>

<header id="performance-header" class="performance-header">
    <div class="performance-toolbar">
        <h1 class="performance-title">Chord Toy</h1>
        <button id="current-preset" class="current-preset" type="button" onclick="openSettingsSheet(this)" aria-expanded="false" aria-controls="settings-sheet" aria-label="現在のプリセット・詳細設定を開く">
            <span id="current-preset-name"></span>
            <span id="current-preset-description"></span>

<script>
const NOTE_NAMES = ["C", "C#", "D", "Eb", "E", "F", "F#", "G", "Ab", "A", "Bb", "B"];
const WHITE_NOTES = ["C", "D", "E", "F", "G", "A", "B"];
const BLACK_NOTES = [
    { note: "C#", pos: 1 },
    { note: "Eb", pos: 2 },
    { note: "F#", pos: 4 },
    { note: "Ab", pos: 5 },
    { note: "Bb", pos: 6 }
];

const ENHARMONIC = { "Db": "C#", "D#": "Eb", "Gb": "F#", "G#": "Ab", "A#": "Bb" };

function normalizeNote(note) {
    return ENHARMONIC[note] || note;
}

function noteIndex(note) {
    return NOTE_NAMES.indexOf(normalizeNote(note));
}

const CHORD_TYPES = {
    Maj:  { semitones: [0, 4, 7],     label: "1 - 3 - 5" },
    m:    { semitones: [0, 3, 7],     label: "1 - b3 - 5" },
    7:    { semitones: [0, 4, 7, 10], label: "1 - 3 - 5 - b7" },
    Maj7: { semitones: [0, 4, 7, 11], label: "1 - 3 - 5 - 7" },
    m7:   { semitones: [0, 3, 7, 10], label: "1 - b3 - 5 - b7" },
    sus4: { semitones: [0, 5, 7],     label: "1 - 4 - 5" },
    dim:  { semitones: [0, 3, 6],     label: "1 - b3 - b5" },
    aug:  { semitones: [0, 4, 8],     label: "1 - 3 - #5" },
    add9: { semitones: [0, 4, 7, 14], label: "1 - 3 - 5 - 9" },
    "6": { semitones: [0, 4, 7, 9], label: "1 - 3 - 5 - 6" },
    "m6": { semitones: [0, 3, 7, 9], label: "1 - b3 - 5 - 6" },
    "mMaj7": { semitones: [0, 3, 7, 11], label: "1 - b3 - 5 - 7" },
    "m7b5": { semitones: [0, 3, 6, 10], label: "1 - b3 - b5 - b7" },
    "9": { semitones: [0, 4, 7, 10, 14], label: "1 - 3 - 5 - b7 - 9" },
    "Maj9": { semitones: [0, 4, 7, 11, 14], label: "1 - 3 - 5 - 7 - 9" },
    "m9": { semitones: [0, 3, 7, 10, 14], label: "1 - b3 - 5 - b7 - 9" },
    "11": { semitones: [0, 4, 7, 10, 14, 17], label: "1 - 3 - 5 - b7 - 9 - 11" },
    "13": { semitones: [0, 4, 7, 10, 14, 21], label: "1 - 3 - 5 - b7 - 9 - 13" },
    "dim7": { semitones: [0, 3, 6, 9], label: "1 - b3 - b5 - bb7" },
    "sus2": { semitones: [0, 2, 7], label: "1 - 2 - 5" },
    "7sus4": { semitones: [0, 5, 7, 10], label: "1 - 4 - 5 - b7" },
    "7b5": { semitones: [0, 4, 6, 10], label: "1 - 3 - b5 - b7" },
    "7#5": { semitones: [0, 4, 8, 10], label: "1 - 3 - #5 - b7" },
    "7b9": { semitones: [0, 4, 7, 10, 13], label: "1 - 3 - 5 - b7 - b9" },
    "7#9": { semitones: [0, 4, 7, 10, 15], label: "1 - 3 - 5 - b7 - #9" },
    "Maj7#11": { semitones: [0, 4, 7, 11, 18], label: "1 - 3 - 5 - 7 - #11" }
};

// SLASH BASS MODEL BEGIN: harmonic bass is independent of quality and chord tones.
function normalizeHarmonyBass(bass) {
    if (bass === undefined || bass === null || bass === "") return null;
    if (typeof bass === "number") {
        if (!Number.isInteger(bass) || bass < 0 || bass > 11) throw new RangeError("Invalid bass pitch class");
        return NOTE_NAMES[bass];
    }
    if (typeof bass !== "string" || noteIndex(bass) < 0) throw new RangeError("Invalid bass note");
    return normalizeNote(bass);
}

function withHarmonyBass(harmony, bass) {
    const result = { ...harmony };
    delete result.bass;
    const note = normalizeHarmonyBass(bass);
    if (note !== null) result.bass = note;
    return result;
}

function resolvePresetChordHarmony(chord, key) {
    if (noteIndex(key) < 0 || !Number.isInteger(chord.rootOffset) || chord.rootOffset < 0 || chord.rootOffset > 11)
        throw new RangeError("Invalid preset root/key");
    if (chord.bass !== undefined) throw new RangeError("Preset bass must use bassOffset, not a fixed note");
    if (chord.bassOffset !== undefined && (!Number.isInteger(chord.bassOffset) || chord.bassOffset < 0 || chord.bassOffset > 11))
        throw new RangeError("Invalid preset bassOffset");
    const root = NOTE_NAMES[(noteIndex(key) + chord.rootOffset) % 12];
    return withHarmonyBass({ ...chord, root }, chord.bassOffset === undefined ? null
        : NOTE_NAMES[(noteIndex(key) + chord.bassOffset) % 12]);
}

function formatHarmonySymbol(harmony) {
    const suffix = { Maj: "", Maj7: "maj7", Maj9: "maj9" }[harmony.quality] ?? harmony.quality;
    const root = normalizeNote(harmony.root), bass = normalizeHarmonyBass(harmony.bass);
    return root + suffix + (bass !== null && noteIndex(bass) !== noteIndex(root) ? "/" + bass : "");
}
// SLASH BASS MODEL END

const SCALES = {
    MAJOR:           { name: "Major", intervals: [0, 2, 4, 5, 7, 9, 11] },
    MINOR:           { name: "Natural Minor", intervals: [0, 2, 3, 5, 7, 8, 10] },
    DORIAN:          { name: "Dorian", intervals: [0, 2, 3, 5, 7, 9, 10] },
    MIXOLYDIAN:      { name: "Mixolydian", intervals: [0, 2, 4, 5, 7, 9, 10] },
    PENTATONIC:      { name: "Major Pentatonic", intervals: [0, 2, 4, 7, 9] },
    MINOR_PENTATONIC:{ name: "Minor Pentatonic", intervals: [0, 3, 5, 7, 10] }
};

// R4: strict, DOM-free music primitives. Scale IDs never silently become MAJOR.
function validateScaleDefinition(definition) {
    return !!definition && noteIndex(definition.key) >= 0 &&
        Object.prototype.hasOwnProperty.call(SCALES, definition.scale);
}

function deriveScalePitchClasses(definition) {
    if (!validateScaleDefinition(definition)) throw new Error("Invalid scale key or ID");
    const root = noteIndex(definition.key);
    return SCALES[definition.scale].intervals.map(interval => (root + interval) % 12);
}

const CHORD_ROLES = Object.freeze({
    Maj: Object.freeze(["R", "3", "5"]), m: Object.freeze(["R", "b3", "5"]),
    "7": Object.freeze(["R", "3", "5", "b7"]), Maj7: Object.freeze(["R", "3", "5", "7"]),
    m7: Object.freeze(["R", "b3", "5", "b7"]), sus4: Object.freeze(["R", "4", "5"]),
    dim: Object.freeze(["R", "b3", "b5"]), aug: Object.freeze(["R", "3", "#5"]),
    add9: Object.freeze(["R", "3", "5", "9"]),
    "6": Object.freeze(["R", "3", "5", "6"]),
    "m6": Object.freeze(["R", "b3", "5", "6"]),
    "mMaj7": Object.freeze(["R", "b3", "5", "7"]),
    "m7b5": Object.freeze(["R", "b3", "b5", "b7"]),
    "9": Object.freeze(["R", "3", "5", "b7", "9"]),
    "Maj9": Object.freeze(["R", "3", "5", "7", "9"]),
    "m9": Object.freeze(["R", "b3", "5", "b7", "9"]),
    "11": Object.freeze(["R", "3", "5", "b7", "9", "11"]),
    "13": Object.freeze(["R", "3", "5", "b7", "9", "13"]),
    "dim7": Object.freeze(["R", "b3", "b5", "bb7"]),
    "sus2": Object.freeze(["R", "2", "5"]),
    "7sus4": Object.freeze(["R", "4", "5", "b7"]),
    "7b5": Object.freeze(["R", "3", "b5", "b7"]),
    "7#5": Object.freeze(["R", "3", "#5", "b7"]),
    "7b9": Object.freeze(["R", "3", "5", "b7", "b9"]),
    "7#9": Object.freeze(["R", "3", "5", "b7", "#9"]),
    "Maj7#11": Object.freeze(["R", "3", "5", "7", "#11"])
});

function deriveChordMetadata(chord) {
    if (!chord || noteIndex(chord.root) < 0 ||
        !Object.prototype.hasOwnProperty.call(CHORD_TYPES, chord.quality)) {
        throw new Error("Invalid chord root or quality");
    }
    const rootPitchClass = noteIndex(chord.root);
    return {
        chordDefinition: copyHarmonyTimelineData(chord),
        root: normalizeNote(chord.root), rootPitchClass,
        // bass stays independent of chord roles; omit/voicing remain opaque metadata.
        tones: CHORD_TYPES[chord.quality].semitones.map((semitones, index) => ({
            role: CHORD_ROLES[chord.quality][index], semitones,
            pitchClass: (rootPitchClass + semitones) % 12
        }))
    };
}

function deriveNaturalChordQuality(root, referenceScale) {
    const pitches = deriveScalePitchClasses(referenceScale);
    if (noteIndex(root) < 0) throw new Error("Invalid chord root");
    const degreeIndex = pitches.indexOf(noteIndex(root));
    if (pitches.length !== 7) return { quality: null, resolved: false, status: "unresolved", reason: "parent-scale-unspecified" };
    if (degreeIndex < 0) return { quality: null, resolved: false, status: "unresolved", reason: "out-of-scale-root" };
    const offsets = [0, 2, 4].map(step => (pitches[(degreeIndex + step) % 7] - noteIndex(root) + 12) % 12);
    const quality = ["Maj", "m", "dim", "aug"].find(id =>
        CHORD_TYPES[id].semitones.every((interval, index) => interval === offsets[index]));
    return { quality: quality || null, resolved: !!quality, status: quality ? "resolved" : "unresolved",
        reason: quality ? "scale-third-stacking" : "unsupported-triad" };
}

function compareScalePitchClassSets(globalPitches, candidatePitches) {
    const removed = [...new Set(globalPitches)].filter(pitch => !candidatePitches.includes(pitch)).sort((a, b) => a - b);
    const added = [...new Set(candidatePitches)].filter(pitch => !globalPitches.includes(pitch)).sort((a, b) => a - b);
    return { added, removed, count: added.length + removed.length };
}

function selectMinimumScaleCandidates(candidates) {
    if (!candidates.length) return { status: "unresolved", selected: null, candidates: [] };
    const minimum = Math.min(...candidates.map(candidate => candidate.change.count));
    const best = candidates.filter(candidate => candidate.change.count === minimum)
        .map(candidate => copyHarmonyTimelineData(candidate));
    return { status: best.length === 1 ? "resolved" : "ambiguous",
        selected: best.length === 1 ? copyHarmonyTimelineData(best[0]) : null, candidates: best };
}

function deriveHarmonyReferenceScale(globalScale, localChord) {
    const globalPitches = deriveScalePitchClasses(globalScale);
    const chord = deriveChordMetadata(localChord);
    const chordPitches = [...new Set(chord.tones.map(tone => tone.pitchClass))];
    if (chordPitches.every(pitch => globalPitches.includes(pitch))) {
        const selected = { key: normalizeNote(globalScale.key), scale: globalScale.scale,
            pitchClasses: globalPitches, change: { added: [], removed: [], count: 0 } };
        return { status: "resolved", source: "global", selected, candidates: [copyHarmonyTimelineData(selected)] };
    }
    const candidates = [];
    Object.keys(SCALES).forEach(scale => NOTE_NAMES.forEach(key => {
        const pitchClasses = deriveScalePitchClasses({ key, scale });
        if (chordPitches.every(pitch => pitchClasses.includes(pitch))) candidates.push({
            key, scale, pitchClasses, change: compareScalePitchClassSets(globalPitches, pitchClasses)
        });
    }));
    return { ...selectMinimumScaleCandidates(candidates), source: "candidate-search",
        candidateSpaceSize: Object.keys(SCALES).length * NOTE_NAMES.length,
        containingCandidateCount: candidates.length };
}

function deriveEffectiveScale(globalScale, referenceScale, localChord) {
    deriveScalePitchClasses(globalScale); // Invalid context is an error, not a fallback case.
    const chordPitches = deriveChordMetadata(localChord).tones.map(tone => tone.pitchClass);
    if (!["resolved", "ambiguous", "unresolved"].includes(referenceScale?.status)) {
        throw new Error("Invalid harmony reference status");
    }
    const fallback = referenceScale.status !== "resolved";
    const selected = fallback ? globalScale : referenceScale.selected;
    const pitchClasses = deriveScalePitchClasses(selected);
    if (!fallback && !chordPitches.every(pitch => pitchClasses.includes(pitch))) {
        throw new Error("Resolved scale must contain local chord");
    }
    return { key: normalizeNote(selected.key), scale: selected.scale, pitchClasses,
        source: fallback ? "global-fallback" : referenceScale.source === "global" ? "global" : "harmony-reference",
        referenceStatus: referenceScale.status,
        missingChordPitchClasses: [...new Set(chordPitches)].filter(pitch => !pitchClasses.includes(pitch)) };
}

function deriveHarmonyScaleContext(globalContext, localChord) {
    const globalScale = { key: globalContext.globalKey, scale: globalContext.globalScale };
    const chordMetadata = deriveChordMetadata(localChord);
    const harmonyReferenceScale = deriveHarmonyReferenceScale(globalScale, localChord);
    return { globalKey: normalizeNote(globalScale.key), globalScale: globalScale.scale,
        localChord: chordMetadata.chordDefinition, chordMetadata, harmonyReferenceScale,
        effectiveScale: deriveEffectiveScale(globalScale, harmonyReferenceScale, localChord) };

function getChordStartBeat(chord, index, preset) {
    if (typeof chord.start === "number") return chord.start;
    return preset.chords.slice(0,index).reduce((sum,c)=>sum+(c.beats||4),0);
}

function getChordIndexAtAbsoluteBeat(absoluteBeat, preset) {
    const chords=preset.chords||[];
    if(!chords.length)return 0;
    let index=0;
    for(let i=0;i<chords.length;i++){
        const start=getChordStartBeat(chords[i],i,preset);
        if(absoluteBeat>=start) index=i; else break;
    }
    return index;
}

    const context = state.contexts[contextName];
    if (!Object.prototype.hasOwnProperty.call(state.contexts, contextName)) throw new Error("Invalid manual harmony context");
    context.harmony = Object.freeze({
        manualHarmony: null,
        displaySource: contextName === "PRESET" ? "accompaniment" : "legacy"
    });
}

function getPresetManualInputQuality() {
    const nextQuality = state.contexts.PRESET.input.nextQuality;
    return nextQuality !== null ? nextQuality : getAccompanimentHarmony().quality;
}

function getDisplayedQualitySelection() {
    if (state.mode === "FREE") return state.currentQuality;
    const context = state.contexts.PRESET;
    return context.input.nextQuality !== null
        ? context.input.nextQuality
        : (getManualHarmony()?.quality ?? getAccompanimentHarmony().quality);
}

function selectInputQuality(quality) {
    if (state.mode === "FREE") {
        state.currentQuality = quality;
        const harmony = getDisplayHarmony();
        if (!replaceHeldLeftQuality(harmony.root, quality, harmony.bass)) playManualHarmony(harmony);
    } else {
        const context = state.contexts.PRESET;
        context.input.nextQuality = quality;
        const current = getDisplayHarmony();
        const selectedBass = getManualBassForRoot(current.root);
        const bass = selectedBass !== undefined ? selectedBass : current.bass;
        const harmony = withHarmonyBass({ root: current.root, quality }, bass);
        if (context.harmony.displaySource === "manual" || harmony.bass !== undefined) {
            activateManualHarmony(harmony.root, quality, "PRESET", performance.now(), harmony.bass);
            if (!replaceHeldLeftQuality(harmony.root, quality, harmony.bass)) playManualHarmony(harmony);
        } else playManualHarmony(harmony); // Audition only, preserving source CURRENT and Timeline.
    }
    updateUI();
}

// Musical-context reset only; clearing an override alone must not reset input choice.
function resetManualInputContext(contextName = getPerformanceContextName()) {
    clearManualHarmony(contextName);
    if (contextName === "PRESET") {
        state.contexts.PRESET.input.nextQuality = null;
        clearManualBassChoice("PRESET");
    }
}

// SLASH BASS INPUT BEGIN: a manual bass choice belongs to one root/context.
function clearManualBassChoice(contextName = getPerformanceContextName()) {
    const input = state.contexts[contextName].input;
    input.nextBass = null;
    input.bassRoot = null;
}

function setManualBassChoice(root, bass) {
    const input = state.contexts[getPerformanceContextName()].input;
    input.bassRoot = normalizeNote(root);
    input.nextBass = normalizeHarmonyBass(bass);
}

function getManualBassForRoot(root) {
    const input = state.contexts[getPerformanceContextName()].input;
    return input.bassRoot !== null && noteIndex(input.bassRoot) === noteIndex(root) ? input.nextBass : undefined;
}

function getLeftInputHarmony(note, nextOccurrence = null) {
    if (nextOccurrence) return getHarmonyFromOccurrence(nextOccurrence);
    if (state.mode === "FREE") return withHarmonyBass({ root: note, quality: getFreeManualInputQuality(note) }, getManualBassForRoot(note));
    const manual = getManualHarmony(), current = getAccompanimentHarmony();
    const explicitBass = getManualBassForRoot(note);
    const bass = explicitBass !== undefined ? explicitBass :
        manual && noteIndex(manual.root) === noteIndex(note) ? manual.bass :
        noteIndex(current.root) === noteIndex(note) ? current.bass : null;
    return withHarmonyBass({ root: note, quality: getPresetManualInputQuality() }, bass);
}

function playManualHarmony(harmony, { held = false, timestamp = null } = {}) {
    if (held) return audio.startChordGroup(harmony.root, 3, harmony.quality, { timestamp, bass: harmony.bass });
    return harmony.bass === undefined ? audio.playChord(harmony.root, 3, harmony.quality)
        : audio.playChord(harmony.root, 3, harmony.quality, 0.015, "manual-left", harmony.bass);
}

function selectInputBass(bass) {
    const current = getDisplayHarmony();
    const harmony = withHarmonyBass({ root: current.root, quality: getDisplayedQualitySelection() }, bass);
    setManualBassChoice(harmony.root, harmony.bass);
    if (state.mode === "FREE") state.currentQuality = harmony.quality;
    else activateManualHarmony(harmony.root, harmony.quality, "PRESET", performance.now(), harmony.bass);
    state.currentRoot = harmony.root;
    if (!replaceHeldLeftQuality(harmony.root, harmony.quality, harmony.bass)) playManualHarmony(harmony);
    updateUI();
}

function auditionPresetHarmony(occurrence, advance = false) {
    if (!occurrence) return;
    const harmony = getHarmonyFromOccurrence(occurrence);
    if (advance) {
        seekPresetHarmonyOccurrence(occurrence);
        clearManualHarmony("PRESET");
    } else {
        state.contexts.PRESET.input.nextQuality = harmony.quality;
        activateManualHarmony(harmony.root, harmony.quality, "PRESET", performance.now(), harmony.bass);
    }
    setManualBassChoice(harmony.root, harmony.bass);
    state.currentRoot = harmony.root;
    state.currentQuality = harmony.quality;
    playManualHarmony(harmony);
    updateUI();
}
// SLASH BASS INPUT END

// Filtering selects a candidate ID; activate it only when the preset changed.
function activatePresetAfterCatalogChange(previousPresetId) {
    if (state.presetId === previousPresetId) return;
    activatePreset(state.presetId);
}

function getManualHarmony() {
    const manual = state.contexts[getPerformanceContextName()].harmony.manualHarmony;
    return manual === null ? null : Object.freeze({ ...manual });
}

function getDisplayHarmony() {
    const source = state.contexts[getPerformanceContextName()].harmony.displaySource;
    switch (source) {
        case "manual":
            return getManualHarmony();
        case "accompaniment":
            return getAccompanimentHarmony();
        case "legacy":
            // Preserve CURRENT/right-key harmony without calling it manual input:
            // the old fields are also written by preset loading and autoplay.
            return state.mode === "FREE"
                ? Object.freeze(withHarmonyBass({ root: state.currentRoot, quality: state.currentQuality }, getManualBassForRoot(state.currentRoot)))
                : getAccompanimentHarmony();
        default:
            throw new Error(`Unknown display harmony source: ${source}`);
    }
}

function getCurrentScaleContext() {
    const scale = state.contexts[getPerformanceContextName()].scale;
    return freezeResolvedHarmonyData(deriveHarmonyScaleContext({
        globalKey: scale.globalKey, globalScale: scale.globalScale
    }, getDisplayHarmony()));
}

function getPlaybackContext() {
    const playback = state.mode === "FREE" ? null : getPresetHarmonyPlayback();
    return Object.freeze({
        playing: state.autoPlaying,
        mode: state.mode,
        context: getPerformanceContextName(),
        progression: Object.freeze({ presetId: getPreset().id, chordIndex: getProgressionSectionIndex() }),
        timing: Object.freeze(playback === null ? {
            // FREE retains the legacy next-tick position.
            nextStep: state.autoBeatStep,
            stepsPerBeat: getActiveRhythm().stepsPerBeat
        } : {
            unwrappedPosition: playback.unwrappedPosition,
            cycleIndex: playback.cycleIndex,
            occurrenceId: playback.currentOccurrence.occurrenceId,
            stepsPerBeat: getActiveRhythm().stepsPerBeat
        }),
        bpm: state.bpm
    });
}

// R2-1: offline timing candidates only. No runtime caller or automatic resolution.
// beatUnit=4 means quarter-note beats; loop=null leaves the preset intent unspecified.
// chordDefinition retains beats/start as source metadata, never as timeline duration.
function copyHarmonyTimelineData(value) {
    if (Array.isArray(value)) return value.map(copyHarmonyTimelineData);
    if (value !== null && typeof value === "object") {
        return Object.fromEntries(Object.entries(value).map(([key, item]) =>
            [key, copyHarmonyTimelineData(item)]));
    }
    return value;
}

function getHarmonySectionId(presetId, index) {
    return JSON.stringify([presetId, index]);
}

function getHarmonyTimelineEndBeat(meter, bars, beatUnit = 4) {
    // Only the currently specified meters are supported. No inferred 6/8 behavior.
    if (beatUnit !== 4 || !["3/4", "4/4"].includes(meter) ||
        !Number.isInteger(bars) || bars <= 0) return null;
    const endBeat = Number(meter.split("/")[0]) * bars;
    return Number.isFinite(endBeat) ? endBeat : null;
}

function deriveHarmonySectionDurations(candidate) {
    // Invalid inputs remain visible as null/non-positive results; never clamp or repair.
    const sections = Array.isArray(candidate?.sections) ? candidate.sections : [];
    return sections.map((section, index) => {
        const end = index + 1 < sections.length
            ? sections[index + 1]?.startBeat : candidate.endBeat;
        const start = section?.startBeat;
        return Number.isFinite(start) && Number.isFinite(end) ? end - start : null;
    });
}

function compareHarmonyTimelineTimings(presetId, beatsDerivedStarts, explicitStarts) {
    const comparable = Array.isArray(beatsDerivedStarts) && Array.isArray(explicitStarts) &&
        beatsDerivedStarts.length > 0 && explicitStarts.length > 0 &&
        beatsDerivedStarts.every(Number.isFinite) && explicitStarts.every(Number.isFinite);
    const mismatchPositions = [];
    if (comparable) {
        for (let index = 0; index < Math.max(beatsDerivedStarts.length, explicitStarts.length); index++) {
            // Exact comparison preserves all current fractional starts; no rounding.
            if (beatsDerivedStarts[index] !== explicitStarts[index]) mismatchPositions.push(index);
        }
    }
    return {
        presetId,
        status: comparable ? (mismatchPositions.length ? "mismatch" : "matched") : "unresolved",
        beatsDerivedStarts: copyHarmonyTimelineData(beatsDerivedStarts),
        explicitStarts: copyHarmonyTimelineData(explicitStarts),
        mismatchPositions
    };
}

function buildHarmonyTimelineCandidates(preset) {
    const chords = Array.isArray(preset?.chords) ? preset.chords : [];
    const beats = chords.map(chord => chord?.beats);
    const hasExplicitStart = chords.some(chord => chord !== null && typeof chord === "object" &&
        Object.prototype.hasOwnProperty.call(chord, "start"));
    const explicitStarts = hasExplicitStart ? chords.map(chord => chord?.start) : null;
    let accumulatedBeat = 0;
    const beatsDerivedStarts = beats.map(beat => {
        const start = accumulatedBeat;
        // Do not use the legacy `beats || 4` fallback for invalid source data.
        accumulatedBeat = Number.isFinite(beat) && beat > 0 ? accumulatedBeat + beat : NaN;
        return start;
    });
    const buildCandidate = (timingSource, starts) => ({
        kind: "candidate",
        timingSource,
        presetId: preset?.id,
        meter: preset?.meter,
        bars: preset?.bars,
        loop: preset?.loop === undefined ? null : copyHarmonyTimelineData(preset.loop),
        beatUnit: 4,
        endBeat: getHarmonyTimelineEndBeat(preset?.meter, preset?.bars),
        sourceTiming: {
            beats: copyHarmonyTimelineData(beats),
            explicitStarts: copyHarmonyTimelineData(explicitStarts)
        },
        sections: chords.map((chord, index) => ({
            sectionId: getHarmonySectionId(preset?.id, index),
            index,
            startBeat: starts[index],
            chordDefinition: copyHarmonyTimelineData(chord)
        }))
    });
    return {
        presetId: preset?.id,
        candidates: {
            beatsDerived: buildCandidate("beats-derived", beatsDerivedStarts),
            // Missing explicit starts are unresolved, never filled from beats.
            explicitStart: explicitStarts === null ? null : buildCandidate("explicit-start", explicitStarts)
        },
        comparison: compareHarmonyTimelineTimings(preset?.id, beatsDerivedStarts, explicitStarts)
    };
}

function validateHarmonyTimelineStarts(starts, endBeat, report) {
    const seen = new Set();
    starts.forEach((start, index) => {
        if (!Number.isFinite(start)) {
            report("start-not-finite", "startBeat must be a finite number", index);
            return;
        }
        if (start < 0) report("negative-start", "startBeat must not be negative", index);
        if (index === 0 && start !== 0) report("first-start-not-zero", "First startBeat must be 0", index);
        if (seen.has(start)) report("duplicate-start", "startBeat must be unique", index);
        seen.add(start);
        if (index > 0 && Number.isFinite(starts[index - 1]) && start <= starts[index - 1]) {
            report("start-not-ascending", "startBeat must be strictly ascending", index);
        }
        if (Number.isFinite(endBeat) && start >= endBeat) {
            report("start-at-or-after-end", "startBeat must be before preset end", index);
        }
    });
}

function validateHarmonyTimelineCandidate(candidate) {
    const diagnostics = [];
    const add = (severity, category, code, message, sectionIndex = null) => {
        diagnostics.push({ presetId: candidate?.presetId, timingSource: candidate?.timingSource,
            severity, category, code, message, sectionIndex });
    };
    const error = (code, message, index = null) => add("error", "structure", code, message, index);
    const sections = Array.isArray(candidate?.sections) ? candidate.sections : [];
    if (typeof candidate?.presetId !== "string" || !candidate.presetId.length) {
        error("missing-preset-id", "A non-empty presetId is required");
    }
    if (!sections.length) error("empty-sections", "At least one section is required");
    const identities = new Set();
    sections.forEach((section, index) => {
        if (typeof section?.sectionId !== "string" || !section.sectionId.length) {
            error("missing-section-id", "sectionId is required", index);
        } else {
            if (identities.has(section.sectionId)) error("duplicate-section-id", "sectionId must be unique", index);
            identities.add(section.sectionId);
            if (section.sectionId !== getHarmonySectionId(candidate.presetId, index)) {
                error("non-deterministic-section-id", "sectionId must match presetId and section index", index);
            }
        }
        if (section?.chordDefinition === null || typeof section?.chordDefinition !== "object" ||
            Array.isArray(section.chordDefinition)) {
            error("missing-chord-definition", "A chord definition object is required", index);
        }
    });
    const supportedMeter = ["3/4", "4/4"].includes(candidate?.meter);
    if (!supportedMeter) add("unresolved", "intent", "unsupported-meter", "Only 3/4 and 4/4 are supported");
    if (candidate?.beatUnit !== 4) add("unresolved", "intent", "unsupported-beat-unit", "Only quarter-note beats are supported");
    if (!Number.isInteger(candidate?.bars) || candidate.bars <= 0) {
        error("invalid-bars", "bars must be a positive integer");
    }
    const expectedEndBeat = getHarmonyTimelineEndBeat(candidate?.meter, candidate?.bars, candidate?.beatUnit);
    if (expectedEndBeat === null) {
        add("unresolved", "intent", "end-unresolved", "Cannot derive preset end from meter/bars/beatUnit");
    }
    // null is the explicit unsupported/unresolved sentinel, not a numeric end.
    if (!(candidate?.endBeat === null && expectedEndBeat === null) &&
        (!Number.isFinite(candidate?.endBeat) || candidate.endBeat <= 0)) {
        error("invalid-end", "endBeat must be finite and positive");
    }
    if (expectedEndBeat !== null && Number.isFinite(candidate?.endBeat) && candidate.endBeat !== expectedEndBeat) {
        error("end-mismatch", "endBeat differs from meter/bars-derived end");
    }
    if (candidate?.loop === null || candidate?.loop === undefined) {
        add("unresolved", "intent", "loop-unspecified", "Preset loop intent is unspecified");
    } else if (typeof candidate.loop !== "boolean") {
        error("invalid-loop", "loop must be boolean or unspecified");
    }

    validateHarmonyTimelineStarts(sections.map(section => section?.startBeat), candidate?.endBeat, error);
    const durations = deriveHarmonySectionDurations(candidate);
    durations.forEach((duration, index) => {
        if (duration === null) {
            // Unsupported end alone is not a structural error.
            if (!(index === sections.length - 1 && expectedEndBeat === null && candidate?.endBeat === null &&
                Number.isFinite(sections[index]?.startBeat))) {
                error("duration-not-finite", "Section duration cannot be derived", index);
            }
        } else if (!Number.isFinite(duration) || duration <= 0) {
            error("duration-not-positive", "Section duration must be finite and positive", index);
        }
    });

    const source = candidate?.sourceTiming;
    const sourceError = (code, message, index = null) => add("error", "source", code, message, index);
    const beats = Array.isArray(source?.beats) ? source.beats : [];
    if (beats.length !== sections.length || !beats.length) sourceError("missing-source-beats", "Source beats must exist for each section");
    beats.forEach((beat, index) => {
        if (!Number.isFinite(beat) || beat <= 0) sourceError("invalid-beats", "Source beats must be finite and positive", index);
    });
    const totalBeats = beats.length && beats.every(beat => Number.isFinite(beat) && beat > 0)
        ? beats.reduce((sum, beat) => sum + beat, 0) : null;
    if (totalBeats !== null && !Number.isFinite(totalBeats)) sourceError("total-beats-not-finite", "Source beats sum must be finite");
    if (Number.isFinite(totalBeats) && expectedEndBeat !== null && totalBeats !== expectedEndBeat) {
        add("unresolved", "intent", "source-total-mismatch", "Source total beats differ from meter/bars end");
    }
    if (source?.explicitStarts === null) {
        add("unresolved", "intent", "explicit-starts-unspecified", "No explicit timing source is present");
    } else if (!Array.isArray(source?.explicitStarts) || source.explicitStarts.length !== sections.length) {
        sourceError("missing-explicit-starts", "Explicit starts must cover every section when present");
    } else {
        validateHarmonyTimelineStarts(source.explicitStarts, candidate?.endBeat, sourceError);
    }
    return {
        // valid describes validation only; it never means timing intent is resolved.
        valid: expectedEndBeat !== null && !diagnostics.some(item => item.severity === "error"),
        structuralStatus: diagnostics.some(item => item.category === "structure" && item.severity === "error")
            ? "invalid" : (expectedEndBeat === null ? "unresolved" : "valid"),
        unresolved: diagnostics.some(item => item.severity === "unresolved"),
        totalBeats,
        durations,
        diagnostics
    };
}

// Explicit development entry: validateAllPresetTimelines(PRESETS). No startup dump.
function validateAllPresetTimelines(presets) {
    const results = presets.map(preset => {
        const built = buildHarmonyTimelineCandidates(preset);
        const beatsDerived = validateHarmonyTimelineCandidate(built.candidates.beatsDerived);
        const explicitStart = built.candidates.explicitStart === null ? null
            : validateHarmonyTimelineCandidate(built.candidates.explicitStart);
        const diagnostics = [...beatsDerived.diagnostics, ...(explicitStart?.diagnostics || [])];
        if (built.comparison.status !== "matched") {
            diagnostics.push({ presetId: built.presetId, timingSource: null, severity: "unresolved", category: "intent",
                code: built.comparison.status === "mismatch" ? "timing-source-mismatch" : "timing-comparison-unresolved",
                message: "Timing sources require review; no candidate has been adopted", sectionIndex: null });
        }
        return {
            ...built,
            validation: { beatsDerived, explicitStart },
            valid: beatsDerived.valid && (explicitStart === null || explicitStart.valid),
            diagnostics
        };
    });
    return {
        total: results.length,
        valid: results.filter(result => result.valid).length,
        matched: results.filter(result => result.comparison.status === "matched").length,
        mismatched: results.filter(result => result.comparison.status === "mismatch").length,
        timingUnresolved: results.filter(result => result.comparison.status === "unresolved").length,
        results,
        diagnostics: results.flatMap(result => result.diagnostics)
    };
}

// R2-2A: the caller may adopt identical timing sources only. Mismatches stay unresolved.
// The default source records provenance; both matched candidates have the same starts.
function resolveMatchedHarmonyTimeline(preset, timingSource = "beats-derived") {
    const audited = validateAllPresetTimelines([preset]).results[0];
    const result = {
        presetId: audited.presetId,
        candidateValid: audited.valid,
        timingResolved: false,
        resolvedTimeline: null,
        candidates: audited.candidates,
        comparison: audited.comparison,
        validation: audited.validation,
        diagnostics: audited.diagnostics
    };
    if (!["beats-derived", "explicit-start"].includes(timingSource)) {
        result.diagnostics.push({ presetId: audited.presetId, timingSource, severity: "error", category: "resolution",
            code: "invalid-timing-source", message: "Select beats-derived or explicit-start", sectionIndex: null });
        return result;
    }
    if (!result.candidateValid || audited.comparison.status !== "matched") return result;
    // Matching starts alone do not resolve a conflicting source total/end.
    if (audited.validation.beatsDerived.totalBeats !== audited.candidates.beatsDerived.endBeat ||
        audited.validation.explicitStart.totalBeats !== audited.candidates.explicitStart.endBeat) return result;

    const selected = timingSource === "beats-derived"
        ? audited.candidates.beatsDerived : audited.candidates.explicitStart;
    result.timingResolved = true;
    result.resolvedTimeline = {
        kind: "resolved",
        presetId: selected.presetId,
        meter: selected.meter,
        bars: selected.bars,
        beatUnit: selected.beatUnit,
        endBeat: selected.endBeat,
        timingSource,
        timingResolution: "matched-sources",
        // Source beats/start remain chord metadata, not independent timeline clocks.
        // Use deriveHarmonySectionDurations() for durations; never store a second source.
        sections: copyHarmonyTimelineData(selected.sections)
    };
    return result;
}

// Explicit development helper only; this does not install timelines in PRESETS/state.
function resolveMatchedPresetTimelines(presets, timingSource = "beats-derived") {
    const results = presets.map(preset => resolveMatchedHarmonyTimeline(preset, timingSource));
    return {
        total: results.length,
        candidateValid: results.filter(result => result.candidateValid).length,

        !["beats-derived", "explicit-start"].includes(matchedTimingSource)) return result;

    const decision = HARMONY_TIMING_RESOLUTIONS[result.presetId];
    const selected = result.candidates.explicitStart;
    const starts = selected.sections.map(section => section.startBeat);
    if (selected.endBeat !== decision.endBeat || starts.length !== decision.starts.length ||
        !starts.every((start, index) => start === decision.starts[index]) ||
        result.validation.beatsDerived.totalBeats !== selected.endBeat ||
        result.validation.explicitStart.totalBeats !== selected.endBeat) {

        result.resolvedTimeline = null;

        beatUnit: selected.beatUnit,
        endBeat: selected.endBeat,
        timingSource: decision.timingSource,

        timingDecision: { presetId: result.presetId, ...copyHarmonyTimelineData(decision) },
        sections: copyHarmonyTimelineData(selected.sections)

    result.diagnostics = result.diagnostics.map(item => item.code === "timing-source-mismatch"

function validateFiniteHarmonyTimeline(timeline) {
    const diagnostics = [];

    if (timeline?.kind !== "resolved") report("not-resolved", "A resolved finite timeline is required");
    if (typeof timeline?.presetId !== "string" || !timeline.presetId.length) {
        report("missing-preset-id", "presetId is required");
    }
    if (timeline?.beatUnit !== 4) report("invalid-beat-unit", "Explicit quarter-note beatUnit is required");
    const expectedEnd = getHarmonyTimelineEndBeat(timeline?.meter, timeline?.bars, timeline?.beatUnit);
    if (expectedEnd === null || timeline?.endBeat !== expectedEnd) {
        report("invalid-end", "endBeat must match supported meter/bars/beatUnit");
    }
    const sections = Array.isArray(timeline?.sections) ? timeline.sections : [];
    if (!sections.length) report("empty-sections", "At least one section is required");
    const identities = new Set();
    sections.forEach((section, index) => {
        if (typeof section?.sectionId !== "string" || !section.sectionId.length || identities.has(section.sectionId)) {
            report("invalid-section-id", "sectionId must be non-empty and unique", index);
        }
        identities.add(section?.sectionId);

            Array.isArray(section.chordDefinition)) report("missing-chord-definition", "chordDefinition is required", index);
    });

    if (!validateFiniteHarmonyTimeline(timeline).valid) throw new TypeError("Invalid finite Harmony Timeline");
    if (!Number.isInteger(sectionIndex) || sectionIndex < 0 || sectionIndex >= timeline.sections.length ||
        !Number.isSafeInteger(cycleIndex) || cycleIndex < 0) throw new RangeError("Invalid section/cycle index");
    const section = timeline.sections[sectionIndex];
    const localEnd = sectionIndex + 1 < timeline.sections.length
        ? timeline.sections[sectionIndex + 1].startBeat : timeline.endBeat;
    const absoluteStartBeat = cycleIndex * timeline.endBeat + section.startBeat;
    const absoluteEndBeat = cycleIndex * timeline.endBeat + localEnd;
    if (!Number.isFinite(absoluteStartBeat) || !Number.isFinite(absoluteEndBeat) ||
        absoluteEndBeat <= absoluteStartBeat) throw new RangeError("Occurrence exceeds numeric precision");
    return {
        occurrenceId: JSON.stringify([timeline.presetId, section.sectionId, cycleIndex]),
        presetId: timeline.presetId, sectionId: section.sectionId, sectionIndex, cycleIndex,
        startBeat: section.startBeat, absoluteStartBeat, absoluteEndBeat,

function deriveHarmonyPlaybackPosition(timeline, policy, unwrappedPosition) {

    if (!validateFiniteHarmonyTimeline(timeline).valid) throw new TypeError("Invalid finite Harmony Timeline");

    // Omission preserves the original finite Loop OFF contract (cycle 0).
    const stopAfterCycle = policy.stopAfterCycle ?? 0;

    if (!Number.isFinite(completionBeat) || !Number.isFinite(unwrappedPosition) || unwrappedPosition < 0 ||

    const terminal = !policy.loopEnabled && unwrappedPosition === completionBeat;
    const cycleIndex = terminal ? stopAfterCycle : Math.floor(unwrappedPosition / timeline.endBeat);
    const timelinePosition = unwrappedPosition - cycleIndex * timeline.endBeat;
    if (!Number.isSafeInteger(cycleIndex) || timelinePosition < 0 ||
        timelinePosition >= timeline.endBeat && !terminal) throw new RangeError("Position exceeds numeric precision");
    let sectionIndex = timeline.sections.length - 1;
    if (!terminal) {

        timeline.sections.forEach((section, index) => {
